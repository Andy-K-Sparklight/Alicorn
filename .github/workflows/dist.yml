name: Distribution

on:
  release:
    types: [ published ]
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: npm ci
      - name: Pack
        run: npx cross-env ALICORN_PACK_PLATFORMS=win32 npm run dist
      - name: List Contents
        run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64-msi
          path: "./dist/Alicorn.x64.msi"
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: win32-arm64-msi
          path: "./dist/Alicorn.arm64.msi"
          compression-level: 0

      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "./dist/Alicorn.x64.msi" \
            "./dist/Alicorn.arm64.msi" \
            --clobber

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: npm ci
      - name: Pack
        run: npm run dist
      - name: List Contents
        run: ls -lh --color=auto ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: "./dist/Alicorn Launcher-win32-x64.zip"
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: win32-arm64
          path: "./dist/Alicorn Launcher-win32-arm64.zip"
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-x64
          path: "./dist/Alicorn Launcher-darwin-x64.dmg"
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: "./dist/Alicorn Launcher-darwin-arm64.dmg"
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: "./dist/Alicorn Launcher-linux-x64.tar.gz"
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: "./dist/Alicorn Launcher-linux-arm64.tar.gz"
          compression-level: 0

      - name: Attach installers to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # electron-installer-dmg treats `out` as a directory, so pack.ts leaves
          # each image at "Alicorn Launcher-darwin-<arch>.dmg/Alicorn Launcher.dmg".
          # upload-artifact accepts a directory; a release asset has to be a file,
          # and both arches would otherwise upload the same inner filename.
          for arch in x64 arm64; do
            src=$(find "./dist/Alicorn Launcher-darwin-$arch.dmg" -maxdepth 1 -name '*.dmg' | head -1)
            cp "$src" "./dist/Alicorn-Launcher-darwin-$arch.dmg"
          done
          gh release upload "${{ github.event.release.tag_name }}" \
            "./dist/Alicorn Launcher-win32-x64.zip" \
            "./dist/Alicorn Launcher-win32-arm64.zip" \
            "./dist/Alicorn-Launcher-darwin-x64.dmg" \
            "./dist/Alicorn-Launcher-darwin-arm64.dmg" \
            "./dist/Alicorn Launcher-linux-x64.tar.gz" \
            "./dist/Alicorn Launcher-linux-arm64.tar.gz" \
            --clobber
