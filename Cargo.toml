[package]
name = "alicorn_r"
authors = ["skjsjhb"]
version = "0.1.0"
edition = "2024"
publish = false
default-run = "alicorn"

[[bin]]
name = "alicorn"
path = "src/main.rs"

[[bin]]
name = "oauth-prototype"
path = "src/indev/oauth-prototype.rs"

[workspace]
members = ["build-src/alicorn-build"]
# Don't make block consider itself being in a workspace
exclude = ["patches/block"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
base64 = "0.23.1"
flate2 = { version = "1.1", default-features = false }
lzma-rust2 = "0.22.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
static-dispatch = "0.3.0"
tar = "0.4.46"
tempfile = "3.27"
toml = "1.1"

[lints]
workspace = true

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_pointer_underscore = "warn"
assigning_clones = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
cfg_not_test = "warn"
checked_conversions = "warn"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_broken_link = "warn"
doc_comment_double_space_linebreaks = "warn"
elidable_lifetime_names = "warn"
equatable_if_let = "warn"
error_impl_error = "warn"
exit = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
field_scoped_visibility_modifiers = "warn"
flat_map_option = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
format_collect = "warn"
inconsistent_struct_constructor = "warn"
items_after_statements = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
linkedlist = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
mismatching_type_param_order = "warn"
missing_const_for_fn = "warn"
mod_module_files = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_type_cast = "warn"
option_option = "warn"
or_fun_call = "warn"
redundant_closure_for_method_calls = "warn"
redundant_pub_crate = "warn"
ref_binding_to_reference = "warn"
ref_option = "warn"
same_name_method = "warn"
search_is_some = "warn"
semicolon_inside_block = "warn"
semicolon_if_nothing_returned = "warn"
semicolon_outside_block = "warn"
similar_names = "warn"
suboptimal_flops = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_lines = "warn"
unchecked_time_subtraction = "warn"
unicode_not_nfc = "warn"
unwrap_used = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_semicolon = "warn"
unnecessary_trailing_comma = "warn"
unnested_or_patterns = "warn"
use_self = "warn"
used_underscore_binding = "warn"
used_underscore_items = "warn"
useless_let_if_seq = "warn"
wildcard_dependencies = "warn"

[features]
prefer-rust-impl = []
oauth-gtk = ["dep:gtk", "dep:webkit6", "dep:glib", "dep:async-io", "dep:futures-lite", "dep:libc"]

[dependencies]
lzma-rust2 = { workspace = true }
thiserror = "2.0"
tempfile = { workspace = true }
delegate = "0.13.5"
static-dispatch = { workspace = true }
faster-hex = "1.0.0"
digest = "0.11.3"
derive_more = { version = "2.1", features = ["from"] }
memchr = "2.8"
sha1 = "0.11.0"
sha2 = { workspace = true }
serde = { workspace = true }
serde-evolve = "0.1.0"
serde_json = { workspace = true }
serde_path_to_error = "0.1.20"
encoding_rs = "0.8.42"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
node-semver = "2.2"
tl = "0.7.8"
html-escape = "0.2.15"
secrecy = "0.10.3"
zeroize = { version = "1.9", features = ["serde"] }
base64 = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_with = "3.24"
smol = "2.0"
http = "1.0"
compression-codecs = { version = "0.4.45", default-features = false, features = [
    "gzip", "zlib", "deflate", "brotli",
] }
regex-lite = "0.1.9"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
sanitise-file-name = "1.0"
md-5 = "0.11.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
typed-path = "0.12.3"
cap-std = "3.4"
cap-fs-ext = "3.4"
cap-tempfile = "3.4"
pathdiff = "0.2.3"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
tar = { workspace = true }
rc-zip = { version = "5.4", default-features = false }
winnow = "0.5.40"
resolvo = "0.12.2"
iced = { version = "0.14.0", default-features = false, features = [
    "advanced", "x11", "wayland", "smol", "wgpu-bare", "image-without-codecs",
] }
rfd = "0.17.2"
open = "5"
unicode-script = "0.5.8"

[target.'cfg(not(target_os = "windows"))'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
common-crypto = "0.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple's libcurl supplies TLS and uses the system trust store.
isahc = { version = "2.0", default-features = false }
curl = { version = "0.4.51", default-features = false, features = ["force-system-lib-on-osx"] }
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
tracing = "0.1"
objc2 = "0.6.5"
dispatch2 = "0.3.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSScreen", "NSGraphics",
    "NSMenu", "NSMenuItem", "NSEvent",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration",
    "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKUIDelegate",
    "WKNavigationAction", "WKNavigationResponse", "WKFrameInfo", "WKWindowFeatures", "WKSecurityOrigin",
] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSObject", "NSOperation", "NSURLSession", "NSURL",
    "NSURLRequest", "NSURLResponse", "NSString", "NSData", "NSDictionary",
    "NSError", "NSURLError", "NSDate", "NSRange", "NSURLCache",
    "NSURLCredentialStorage", "NSHTTPCookieStorage", "NSValue", "NSArray",
    "NSURLAuthenticationChallenge", "NSURLCredential", "NSURLProtectionSpace",
    "NSUUID", "NSProcessInfo", "NSGeometry", "NSSet",
] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecItem", "SecBase"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGGeometry", "CGDataProvider"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
    "std", "parking_lot", "gles", "wgsl",
] }
webview2-com = "0.39.1"
windows-registry = "0.6.1"
windows = { version = "0.62.2", default-features = false, features = [
    "std", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_Foundation", "Win32_Networking_WinHttp",
    "Win32_Graphics_Imaging", "Win32_System_Com",
    "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx",
    "Win32_System_Memory", "Win32_System_Registry",
] }
flate2 = { workspace = true, features = ["zlib-rs", "runtime_detection"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"], optional = true }
webkit6 = { version = "0.6.1", optional = true }
glib = { version = "0.22.10", optional = true }
async-io = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
libc = { version = "0.2.190", optional = true }
hyper = { version = "1.12", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "http2", "client-proxy"] }
smol-hyper = "0.1.1"
async-net = "2.0"
async-tungstenite = { version = "0.35.0", default-features = false, features = ["handshake"] }
futures-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8.4"
bytes = "1.12"
http-body-util = "0.1.5"
tower-service = "0.3.3"
proxy-watch = { version = "0.3.0", default-features = false, features = ["resolve", "linux-gnome", "linux-kde"] }
socker = { version = "1.0", default-features = false }
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto", "unstable"] }
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
zune-jpeg = "0.5.15"
zune-core = "0.5.3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
flate2 = { workspace = true, features = ["zlib"] }

[dev-dependencies]
tiny_http = "0.12.0"
ttf-parser = "0.25.1"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
async-tungstenite = { version = "0.35.0", default-features = false, features = ["handshake", "futures-03-sink"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
hyper = { version = "1.12", default-features = false, features = ["server"] }

[build-dependencies]
alicorn-build = { path = "build-src/alicorn-build" }
cfg_aliases = "0.2.2"
pkg-config = "0.3.33"

[patch.crates-io]
block = { path = "patches/block" } # Fix a soundness issue

[profile.dev]
debug = "limited"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[profile.test.package."*"]
opt-level = 0 # Makes CI faster

[profile.release.package]
iced_wgpu = { opt-level = 3 }
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
cryoglyph = { opt-level = 3 }
iced_graphics = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
harfrust = { opt-level = 3 }
swash = { opt-level = 3 }
skrifa = { opt-level = 3 }
read-fonts = { opt-level = 3 }
zeno = { opt-level = 3 }
yazi = { opt-level = 3 }
lzma-rust2 = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
tiny-skia-path = { opt-level = 3 }
iced_tiny_skia = { opt-level = 3 }
sha1 = { opt-level = 3 }
sha2 = { opt-level = 3 }
md-5 = { opt-level = 3 }
iced_core = { opt-level = 3 }
iced_widget = { opt-level = 3 }
naga = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
